<!DOCTYPE html>
<html>
<title>{{title}}</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="stylesheets/w3.css">

<body>

    <div class="w3-sidebar w3-bar-block w3-collapse w3-card w3-animate-left" style="width:200px;" id="mySidebar">
        <button class="w3-bar-item w3-button w3-large w3-hide-large" onclick="w3_close()">Close &times;</button>

        <a href="introduction.html" class="w3-bar-item w3-button" target="iframe_a">Introduction</a></li>
        <ul>
            {% for section in sections %}
            <li>{{section}}</li>
            <ul>
                {% for song in sections[section] %}
                <li><a href="{{song.output_file}}" class="w3-bar-item w3-button" target="iframe_a">{{song.title}}</a>
                </li>
                {% endfor %}
            </ul>
            {% endfor %}
        </ul>
    </div>

    <div class="w3-main" style="margin-left:200px">
        <div class="w3-teal">
            <button class="w3-button w3-teal w3-xlarge w3-hide-large" onclick="w3_open()">&#9776;</button>
            <div class="w3-container">
                <h1>{{title}}</h1>
            </div>
        </div>

        <div>
            <iframe src="introduction.html" name="iframe_a" style="border:none;" height="2500px" width="100%"
                title="Iframe Example"></iframe>
        </div>

    </div>

    <script>
        function w3_open() {
            document.getElementById("mySidebar").style.display = "block";
        }

        function w3_close() {
            document.getElementById("mySidebar").style.display = "none";
        }
    </script>

</body>

</html>
